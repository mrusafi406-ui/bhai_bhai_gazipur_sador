<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Bhai Bhai Store — SR প্যানেল</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1f4e78">
  <style>
    :root {
      --bg: #f4f6f9;
      --card: #fff;
      --text: #1f2937;
      --muted: #6b7280;
      --brand: #1f4e78;
      --brand2: #2e75b6;
      --good: #1e7e34;
      --warn: #9c5700;
      --bad: #9c0006;
      --goodbg: #e6f4ea;
      --warnbg: #fff4d6;
      --badbg: #fde3e3;
      --border: #e5e7eb;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color: #fff;
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    header h1 { margin: 0; font-size: 17px; }
    header p { margin: 4px 0 0; font-size: 12px; opacity: 0.9; }
    .wrap { max-width: 820px; margin: 0 auto; padding: 14px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .card h2 {
      font-size: 14px;
      margin: 0 0 10px;
      color: var(--muted);
      text-transform: uppercase;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
      margin-top: 10px;
    }
    select, input[type=date], input[type=number], input[type=text] {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 15px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 7px 6px; border-bottom: 1px solid var(--border); text-align: center; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; }
    td:first-child, th:first-child { text-align: left; }
    input.cell {
      width: 64px;
      padding: 6px;
      text-align: center;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
    }
    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 10px;
      background: var(--brand2);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      margin-top: 14px;
      cursor: pointer;
    }
    .btn.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text);
    }
    .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .kpi {
      background: var(--bg);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }
    .kpi .v { font-size: 18px; font-weight: 700; }
    .kpi .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
    }
    .pill.good { background: var(--goodbg); color: var(--good); }
    .pill.warn { background: var(--warnbg); color: var(--warn); }
    .pill.bad { background: var(--badbg); color: var(--bad); }
    .msg {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: 8px;
      margin: 10px auto 0;
      display: none;
      max-width: 820px;
      width: calc(100% - 28px);
    }
    .msg.show { display: block; }
    .msg.ok { background: var(--goodbg); color: var(--good); }
    .msg.err { background: var(--badbg); color: var(--bad); }
    .foot {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      padding: 16px;
    }
    .target-input {
      width: 78px;
      padding: 4px;
      text-align: center;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 12px;
    }
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 16px;
    }
    .modal-bg.show { display: flex; }
    .modal {
      background: var(--card);
      border-radius: 12px;
      padding: 18px;
      max-width: 320px;
      width: 100%;
    }
    .tabs { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; }
    .tab-btn {
      flex: none;
      padding: 8px 13px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active {
      background: var(--brand2);
      border-color: var(--brand2);
      color: #fff;
    }
  </style>
</head>
<body>
  <header>
    <h1>🥤 Bhai Bhai Store — SR প্যানেল</h1>
    <p id="subtitle">লোড হচ্ছে…</p>
  </header>

  <div class="wrap" id="app"></div>
  <div id="flashMsg" class="msg"></div>
  <div class="foot" id="footlinks"></div>

  <div class="modal-bg" id="pinModal">
    <div class="modal">
      <h2 style="margin-top:0;font-size:15px;">অ্যাডমিন পাসকোড</h2>
      <input type="number" id="pinInput" placeholder="পাসকোড দিন">
      <button class="btn" id="pinSubmit">প্রবেশ করুন</button>
      <button class="btn secondary" id="pinCancel">বাতিল</button>
    </div>
  </div>

  <script id="state-data" type="application/json">
    {"adminPin":"2580","officers":[{"id":"maruf","name":"Maruf Hossain","targetBDT":1500000,"commissionRate":6},{"id":"raju","name":"Raju Hossain","targetBDT":1200000,"commissionRate":6},{"id":"sumon","name":"Sumon Hossain","targetBDT":1000000,"commissionRate":6}],"products":[{"id":"tea","name":"Tea","price":120},{"id":"chips","name":"Chips","price":90},{"id":"water","name":"Water","price":60},{"id":"snack","name":"Snack","price":150}],"entries":[],"orders":[],"lifting":[],"ledger":[],"inventoryOpening":{"tea":0,"chips":0,"water":0,"snack":0}}
  </script>

  <script>
    (function () {
      var STATE = JSON.parse(document.getElementById('state-data').textContent);
      var app = document.getElementById('app');
      var subtitle = document.getElementById('subtitle');
      var footlinks = document.getElementById('footlinks');
      var adminTab = 'overview';
      var msgTimer = null;

      try {
        var saved = localStorage.getItem('bhaibhai_state');
        if (saved) {
          var parsed = JSON.parse(saved);
          for (var k in parsed) STATE[k] = parsed[k];
        }
      } catch (e) {}

      function saveState() {
        try {
          localStorage.setItem('bhaibhai_state', JSON.stringify(STATE));
          return true;
        } catch (e) {
          showMsg('err', 'সংরক্ষণ ব্যর্থ');
          return false;
        }
      }

      function todayStr() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      }

      function monthKey(s) {
        return (s || '').slice(0, 7);
      }

      function fmt(n) {
        var val = Number(n) || 0;
        return (Math.round(val * 10) / 10).toLocaleString('en-US');
      }

      function productObj(id) {
        return (STATE.products || []).find(function (p) { return p.id === id; }) || null;
      }

      function entryKey(date, officerId, productId) {
        return date + '__' + officerId + '__' + productId;
      }

      function upsertEntry(date, officerId, productId, salesCtn, damageCtn) {
        var key = entryKey(date, officerId, productId);
        var idx = (STATE.entries || []).findIndex(function (entry) { return entry.key === key; });
        if (idx >= 0) {
          STATE.entries[idx].salesCtn = Number(salesCtn) || 0;
          STATE.entries[idx].damageCtn = Number(damageCtn) || 0;
          STATE.entries[idx].ts = Date.now();
          return;
        }
        STATE.entries.push({
          key: key,
          date: date,
          officerId: officerId,
          product: productId,
          salesCtn: Number(salesCtn) || 0,
          damageCtn: Number(damageCtn) || 0,
          ts: Date.now()
        });
      }

      function orderKey(date, officerId) {
        return date + '__' + officerId;
      }

      function getOrder(date, officerId) {
        return (STATE.orders || []).find(function (o) { return o.key === orderKey(date, officerId); }) || null;
      }

      function upsertOrder(date, officerId, qty) {
        var key = orderKey(date, officerId);
        var idx = (STATE.orders || []).findIndex(function (o) { return o.key === key; });
        if (qty > 0) {
          var rec = {
            key: key,
            date: date,
            officerId: officerId,
            orderCtn: Number(qty) || 0,
            ts: Date.now()
          };
          if (idx >= 0) {
            STATE.orders[idx] = rec;
          } else {
            STATE.orders.push(rec);
          }
          return;
        }
        if (idx >= 0) {
          STATE.orders.splice(idx, 1);
        }
      }

      function salesForDate(date, officerId) {
        return (STATE.entries || []).filter(function (e) { return e.date === date && e.officerId === officerId; }).reduce(function (sum, e) { return sum + (Number(e.salesCtn) || 0); }, 0);
      }

      function prevDateStr(s) {
        var d = new Date(s + 'T00:00:00');
        d.setDate(d.getDate() - 1);
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }

      function bounceFor(date, officerId) {
        var prev = prevDateStr(date);
        var ord = getOrder(prev, officerId);
        if (!ord || ord.orderCtn <= 0) return null;
        var salesToday = salesForDate(date, officerId);
        var bounce = Math.max(ord.orderCtn - salesToday, 0);
        var pct = ord.orderCtn > 0 ? bounce / ord.orderCtn : 0;
        return { orderDate: prev, orderCtn: ord.orderCtn, salesToday: salesToday, bounce: bounce, bouncePct: pct };
      }

      function showMsg(type, text) {
        var m = document.getElementById('flashMsg');
        if (!m) return;
        m.textContent = text;
        m.className = 'msg show ' + type;
        clearTimeout(msgTimer);
        msgTimer = setTimeout(function () {
          m.classList.remove('show');
        }, 2600);
      }

      function renderEntry() {
        subtitle.textContent = 'দৈনিক সেলস ও ড্যামেজ এন্ট্রি';
        var savedOfficer = localStorage.getItem('srOfficerId') || STATE.officers[0].id;
        var savedDate = todayStr();

        app.innerHTML = '
          <div class="card">
            <h2>অফিসার ও তারিখ</h2>
            <label>আপনার নাম</label>
            <select id="officerSel">' + STATE.officers.map(function (o) {
              return '<option value="' + o.id + '" ' + (o.id === savedOfficer ? 'selected' : '') + '>' + o.name + '</option>';
            }).join('') + '</select>
            <label>তারিখ</label>
            <input type="date" id="dateSel" value="' + savedDate + '">
          </div>

          <div class="card">
            <h2>সেলস ও ড্যামেজ</h2>
            <table>
              <thead><tr><th>প্রোডাক্ট</th><th>সেলস</th><th>ড্যামেজ</th></tr></thead>
              <tbody id="prodRows"></tbody>
            </table>
          </div>

          <div class="card">
            <h2>অর্ডার</h2>
            <label>আজকের অর্ডার (কার্টন)</label>
            <input type="number" id="orderInput" min="0" step="0.5" placeholder="0">
            <button class="btn" id="saveBtn">সংরক্ষণ করুন</button>
          </div>

          <div class="card" id="bounceCard"></div>
          <div class="card" id="todaySummary"></div>
        ';

        var oid = document.getElementById('officerSel').value;
        var date = document.getElementById('dateSel').value;

        var rows = STATE.products.map(function (p) {
          var rec = (STATE.entries || []).find(function (entry) { return entry.key === entryKey(date, oid, p.id); });
          return '<tr><td>' + p.name + '</td><td><input class="cell" type="number" min="0" step="0.5" data-p="' + p.id + '" data-f="s" value="' + (rec ? (rec.salesCtn || '') : '') + '"></td><td><input class="cell" type="number" min="0" step="0.5" data-p="' + p.id + '" data-f="d" value="' + (rec ? (rec.damageCtn || '') : '') + '"></td></tr>';
        }).join('');
        document.getElementById('prodRows').innerHTML = rows;

        var ordRec = getOrder(date, oid);
        document.getElementById('orderInput').value = ordRec ? ordRec.orderCtn : '';

        renderBounceCard(oid, date);
        renderTodaySummary(oid, date);

        document.getElementById('officerSel').addEventListener('change', function (e) {
          localStorage.setItem('srOfficerId', e.target.value);
          var dateValue = document.getElementById('dateSel').value;
          var oidValue = e.target.value;
          var rowsHtml = STATE.products.map(function (p) {
            var rec = (STATE.entries || []).find(function (entry) { return entry.key === entryKey(dateValue, oidValue, p.id); });
            return '<tr><td>' + p.name + '</td><td><input class="cell" type="number" min="0" step="0.5" data-p="' + p.id + '" data-f="s" value="' + (rec ? (rec.salesCtn || '') : '') + '"></td><td><input class="cell" type="number" min="0" step="0.5" data-p="' + p.id + '" data-f="d" value="' + (rec ? (rec.damageCtn || '') : '') + '"></td></tr>';
          }).join('');
          document.getElementById('prodRows').innerHTML = rowsHtml;
          var orderRec = getOrder(dateValue, oidValue);
          document.getElementById('orderInput').value = orderRec ? orderRec.orderCtn : '';
          renderBounceCard(oidValue, dateValue);
          renderTodaySummary(oidValue, dateValue);
        });

        document.getElementById('dateSel').addEventListener('change', function () {
          var d = document.getElementById('dateSel').value;
          var o = document.getElementById('officerSel').value;
          var rowsHtml = STATE.products.map(function (p) {
            var rec = (STATE.entries || []).find(function (entry) { return entry.key === entryKey(d, o, p.id); });
            return '<tr><td>' + p.name + '</td><td><input class="cell" type="number" min="0" step="0.5" data-p="' + p.id + '" data-f="s" value="' + (rec ? (rec.salesCtn || '') : '') + '"></td><td><input class="cell" type="number" min="0" step="0.5" data-p="' + p.id + '" data-f="d" value="' + (rec ? (rec.damageCtn || '') : '') + '"></td></tr>';
          }).join('');
          document.getElementById('prodRows').innerHTML = rowsHtml;
          var orderRec = getOrder(d, o);
          document.getElementById('orderInput').value = orderRec ? orderRec.orderCtn : '';
          renderBounceCard(o, d);
          renderTodaySummary(o, d);
        });

        document.getElementById('saveBtn').addEventListener('click', function () {
          var oid = document.getElementById('officerSel').value;
          var date = document.getElementById('dateSel').value;
          if (!date) {
            showMsg('err', 'তারিখ নির্বাচন করুন।');
            return;
          }

          document.querySelectorAll('#prodRows input[data-f="s"]').forEach(function (inp) {
            var p = inp.getAttribute('data-p');
            var sv = parseFloat(inp.value) || 0;
            var di = document.querySelector('#prodRows input[data-p="' + p + '"][data-f="d"]');
            var dv = parseFloat(di.value) || 0;
            if (sv > 0 || dv > 0) upsertEntry(date, oid, p, sv, dv);
          });

          var ov = parseFloat(document.getElementById('orderInput').value) || 0;
          upsertOrder(date, oid, ov);
          localStorage.setItem('srOfficerId', oid);
          if (saveState()) {
            showMsg('ok', '✅ সংরক্ষণ হয়েছে!');
            renderBounceCard(oid, date);
            renderTodaySummary(oid, date);
          }
        });
      }

      function renderBounceCard(oid, date) {
        var b = bounceFor(date, oid);
        var node = document.getElementById('bounceCard');
        if (!node) return;

        if (!b) {
          node.innerHTML = '<h2>অর্ডার বনাম সেলস</h2><p style="font-size:12px;color:var(--muted);">গতকাল কোনো অর্ডার নেই।</p>';
          return;
        }

        var cls = b.bouncePct > 0.2 ? 'bad' : (b.bouncePct > 0.1 ? 'warn' : 'good');
        node.innerHTML = '<h2>গতকালের (' + b.orderDate + ') অর্ডার বনাম আজকের সেলস</h2><div class="kpis"><div class="kpi"><div class="v">' + fmt(b.orderCtn) + '</div><div class="l">অর্ডার</div></div><div class="kpi"><div class="v">' + fmt(b.salesToday) + '</div><div class="l">সেলস</div></div><div class="kpi"><div class="v"><span class="pill ' + cls + '">' + fmt(b.bounce) + '</span></div><div class="l">বাউন্স</div></div></div>';
      }

      function renderTodaySummary(oid, date) {
        var s = 0;
        var d = 0;
        var v = 0;
        (STATE.entries || []).filter(function (e) { return e.officerId === oid && e.date === date; }).forEach(function (e) {
          s += Number(e.salesCtn) || 0;
          d += Number(e.damageCtn) || 0;
          var pr = productObj(e.product);
          v += (Number(e.salesCtn) || 0) * ((pr && pr.price) || 0);
        });

        var officer = (STATE.officers || []).find(function (x) { return x.id === oid; }) || { name: oid };
        var node = document.getElementById('todaySummary');
        if (!node) return;
        node.innerHTML = '<h2>' + date + ' — আজকের সারাংশ (' + officer.name + ')</h2><div class="kpis"><div class="kpi"><div class="v">' + fmt(s) + '</div><div class="l">সেলস</div></div><div class="kpi"><div class="v">' + fmt(d) + '</div><div class="l">ড্যামেজ</div></div><div class="kpi"><div class="v">৳ ' + fmt(v) + '</div><div class="l">মূল্য</div></div></div>';
      }

      function overviewHTML() {
        var ym = todayStr().slice(0, 7);
        var totals = { sales: 0, damage: 0, value: 0 };
        (STATE.entries || []).filter(function (e) { return monthKey(e.date) === ym; }).forEach(function (e) {
          totals.sales += Number(e.salesCtn) || 0;
          totals.damage += Number(e.damageCtn) || 0;
          var pr = productObj(e.product);
          totals.value += (Number(e.salesCtn) || 0) * ((pr && pr.price) || 0);
        });

        var bars = (STATE.officers || []).map(function (o) {
          var target = Number(o.targetBDT) || 0;
          var value = (STATE.entries || []).filter(function (e) { return e.officerId === o.id && monthKey(e.date) === ym; }).reduce(function (sum, e) {
            var pr = productObj(e.product);
            return sum + ((Number(e.salesCtn) || 0) * ((pr && pr.price) || 0));
          }, 0);
          var ratio = target > 0 ? Math.min(value / target, 1) : 0;
          var cls = ratio >= 0.8 ? 'good' : (ratio >= 0.5 ? 'warn' : 'bad');
          return '<div class="bar-row"><div class="bar-name">' + o.name + '</div><div class="bar-track"><div class="bar-fill" style="width:' + (ratio * 100) + '%;background:' + (cls === 'good' ? 'var(--good)' : (cls === 'warn' ? 'var(--warn)' : 'var(--bad)')) + ';"></div></div><div class="bar-pct">' + Math.round(ratio * 100) + '%</div></div>';
        }).join('');

        return '<div class="card"><h2>এই মাসের সারাংশ (' + ym + ')</h2><div class="kpis"><div class="kpi"><div class="v">' + fmt(totals.sales) + '</div><div class="l">মোট সেলস</div></div><div class="kpi"><div class="v">' + fmt(totals.damage) + '</div><div class="l">মোট ড্যামেজ</div></div><div class="kpi"><div class="v">৳ ' + fmt(totals.value) + '</div><div class="l">মোট মূল্য</div></div></div>' + bars + '</div>';
      }

      function inventoryHTML() {
        var rows = (STATE.products || []).map(function (p) {
          var lifted = (STATE.lifting || []).filter(function (l) { return l.product === p.id; }).reduce(function (sum, l) { return sum + (Number(l.qtyCtn) || 0); }, 0);
          var sold = (STATE.entries || []).filter(function (e) { return e.product === p.id; }).reduce(function (sum, e) { return sum + (Number(e.salesCtn) || 0); }, 0);
          var damaged = (STATE.entries || []).filter(function (e) { return e.product === p.id; }).reduce(function (sum, e) { return sum + (Number(e.damageCtn) || 0); }, 0);
          var opening = Number(STATE.inventoryOpening[p.id]) || 0;
          var stock = opening + lifted - sold - damaged;
          return '<tr><td>' + p.name + '</td><td><input class="target-input" type="number" data-inv="' + p.id + '" value="' + opening + '"></td><td>' + fmt(lifted) + '</td><td>' + fmt(stock) + '</td></tr>';
        }).join('');

        return '<div class="card"><h2>ইনভেন্টরি</h2><table><thead><tr><th>প্রোডাক্ট</th><th>ওপেনিং</th><th>লিফটেড</th><th>স্টক</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      }

      function liftingHTML() {
        var rows = (STATE.lifting || []).slice().reverse().slice(0, 20).map(function (l) {
          var product = productObj(l.product);
          return '<tr><td>' + (l.date || todayStr()) + '</td><td>' + (product ? product.name : l.product) + '</td><td>' + fmt(l.qtyCtn) + '</td></tr>';
        }).join('');

        return '<div class="card"><h2>নতুন লিফটিং</h2><label>তারিখ</label><input type="date" id="liftDate" value="' + todayStr() + '"><label>প্রোডাক্ট</label><select id="liftProduct">' + (STATE.products || []).map(function (p) { return '<option value="' + p.id + '">' + p.name + '</option>'; }).join('') + '</select><label>পরিমাণ (কার্টন)</label><input type="number" id="liftQty" min="0" step="0.5" value="0"><button class="btn" id="liftSave">লিফটিং যোগ করুন</button><table><thead><tr><th>তারিখ</th><th>প্রোডাক্ট</th><th>পরিমাণ</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      }

      function ordersHTML() {
        var ym = todayStr().slice(0, 7);
        var rows = (STATE.officers || []).map(function (o) {
          var ob = (STATE.orders || []).filter(function (x) { return x.officerId === o.id && monthKey(x.date) === ym; }).reduce(function (sum, x) { return sum + (Number(x.orderCtn) || 0); }, 0);
          return '<tr><td>' + o.name + '</td><td>' + fmt(ob) + '</td></tr>';
        }).join('');

        return '<div class="card"><h2>অর্ডার — ' + ym + '</h2><table><thead><tr><th>SR</th><th>মোট অর্ডার</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      }

      function ledgerHTML() {
        var bal = (STATE.ledger || []).reduce(function (sum, l) { return sum + ((l.type === 'credit' ? 1 : -1) * (Number(l.amount) || 0)); }, 0);
        var rows = (STATE.ledger || []).slice().reverse().slice(0, 20).map(function (l) {
          return '<tr><td>' + l.date + '</td><td><span class="pill ' + (l.type === 'credit' ? 'good' : 'bad') + '">' + (l.type === 'credit' ? 'ক্রেডিট' : 'ডেবিট') + '</span></td><td>৳ ' + fmt(l.amount) + '</td></tr>';
        }).join('');

        return '<div class="card"><h2>লেজার</h2><div class="kpis" style="grid-template-columns:1fr;"><div class="kpi"><div class="v">৳ ' + fmt(bal) + '</div><div class="l">ব্যালেন্স</div></div></div><table><thead><tr><th>তারিখ</th><th>ধরন</th><th>টাকা</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      }

      function entriesHTML() {
        var rows = (STATE.entries || []).slice().reverse().slice(0, 30).map(function (e) {
          var officer = (STATE.officers || []).find(function (x) { return x.id === e.officerId; }) || { name: e.officerId };
          var product = productObj(e.product);
          return '<tr><td>' + e.date + '</td><td>' + officer.name + '</td><td>' + (product ? product.name : e.product) + '</td><td>' + fmt(e.salesCtn) + '</td><td>' + fmt(e.damageCtn) + '</td></tr>';
        }).join('');

        return '<div class="card"><h2>সর্বশেষ এন্ট্রি</h2><table><thead><tr><th>তারিখ</th><th>SR</th><th>প্রোডাক্ট</th><th>সেলস</th><th>ড্যামেজ</th></tr></thead><tbody>' + rows + '</tbody></table></div>';
      }

      function wireTabEvents() {
        document.querySelectorAll('[data-inv]').forEach(function (inp) {
          inp.addEventListener('change', function () {
            var pid = inp.getAttribute('data-inv');
            STATE.inventoryOpening[pid] = parseFloat(inp.value) || 0;
            saveState();
          });
        });

        var liftSave = document.getElementById('liftSave');
        if (liftSave) {
          liftSave.addEventListener('click', function () {
            var d = document.getElementById('liftDate').value;
            var p = document.getElementById('liftProduct').value;
            var q = parseFloat(document.getElementById('liftQty').value) || 0;
            if (!d || q <= 0) return;
            (STATE.lifting || []).push({ date: d, product: p, qtyCtn: q, ts: Date.now() });
            saveState();
            renderAdmin();
          });
        }
      }

      function renderAdmin() {
        subtitle.textContent = 'অ্যাডমিন ড্যাশবোর্ড';
        app.innerHTML = '
          <div class="tabs">
            <button class="tab-btn ' + (adminTab === 'overview' ? 'active' : '') + '" data-tab="overview">ওভারভিউ</button>
            <button class="tab-btn ' + (adminTab === 'inventory' ? 'active' : '') + '" data-tab="inventory">ইনভেন্টরি</button>
            <button class="tab-btn ' + (adminTab === 'lifting' ? 'active' : '') + '" data-tab="lifting">লিফটিং</button>
            <button class="tab-btn ' + (adminTab === 'orders' ? 'active' : '') + '" data-tab="orders">অর্ডার</button>
            <button class="tab-btn ' + (adminTab === 'ledger' ? 'active' : '') + '" data-tab="ledger">লেজার</button>
            <button class="tab-btn ' + (adminTab === 'entries' ? 'active' : '') + '" data-tab="entries">এন্ট্রি</button>
          </div>
          <div id="tabBody"></div>
          <button class="btn secondary" id="lockBtn">🔒 লক করুন</button>
        ';

        document.querySelectorAll('.tab-btn').forEach(function (b) {
          b.addEventListener('click', function () {
            adminTab = b.getAttribute('data-tab');
            renderAdmin();
          });
        });

        var body = document.getElementById('tabBody');
        if (adminTab === 'overview') body.innerHTML = overviewHTML();
        else if (adminTab === 'inventory') body.innerHTML = inventoryHTML();
        else if (adminTab === 'lifting') body.innerHTML = liftingHTML();
        else if (adminTab === 'orders') body.innerHTML = ordersHTML();
        else if (adminTab === 'ledger') body.innerHTML = ledgerHTML();
        else body.innerHTML = entriesHTML();

        wireTabEvents();

        document.getElementById('lockBtn').addEventListener('click', function () {
          sessionStorage.removeItem('srAdminUnlocked');
          renderEntry();
          renderFootlinks();
        });
      }

      function renderFootlinks() {
        footlinks.innerHTML = '<span>© Bhai Bhai Store</span> · <a href="#" id="adminLink">🔐 অ্যাডমিন</a>';
        document.getElementById('adminLink').addEventListener('click', function (e) {
          e.preventDefault();
          if (sessionStorage.getItem('srAdminUnlocked') === 'yes') {
            renderAdmin();
          } else {
            document.getElementById('pinModal').classList.add('show');
            document.getElementById('pinInput').value = '';
            document.getElementById('pinInput').focus();
          }
        });
      }

      document.getElementById('pinSubmit').addEventListener('click', function () {
        var pin = document.getElementById('pinInput').value.trim();
        if (pin === String(STATE.adminPin)) {
          sessionStorage.setItem('srAdminUnlocked', 'yes');
          document.getElementById('pinModal').classList.remove('show');
          renderAdmin();
          renderFootlinks();
        } else {
          alert('ভুল পাসকোড!');
        }
      });

      document.getElementById('pinCancel').addEventListener('click', function () {
        document.getElementById('pinModal').classList.remove('show');
      });

      document.getElementById('pinInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') document.getElementById('pinSubmit').click();
      });

      if (sessionStorage.getItem('srAdminUnlocked') === 'yes') {
        renderAdmin();
      } else {
        renderEntry();
      }
      renderFootlinks();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      }
    })();
  </script><script>

    renderAdmin();
  } else {
    renderEntry();
  }
  renderFootlinks();
})();
</script>
</body>
