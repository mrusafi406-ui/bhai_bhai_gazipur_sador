<title>Bhai Bhai Store — SR প্যানেল</title>

<style>
:root{--bg:#f4f6f9;--card:#fff;--text:#1f2937;--muted:#6b7280;--brand:#1f4e78;--brand2:#2e75b6;--good:#1e7e34;--warn:#9c5700;--bad:#9c0006;--goodbg:#e6f4ea;--warnbg:#fff4d6;--badbg:#fde3e3;--border:#e2e5ea;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,sans-serif;}
header{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;padding:16px;position:sticky;top:0;z-index:5;}
header h1{margin:0;font-size:17px;}
header p{margin:4px 0 0;font-size:12px;opacity:.9;}
.wrap{max-width:820px;margin:0 auto;padding:14px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:14px;}
.card h2{font-size:14px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;margin-top:10px;}
select,input[type=date],input[type=number],input[type=text]{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:15px;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th,td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:center;}
th{color:var(--muted);font-weight:600;font-size:12px;}
td:first-child,th:first-child{text-align:left;}
input.cell{width:64px;padding:6px;text-align:center;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;background:var(--brand2);color:#fff;font-size:15px;font-weight:600;margin-top:14px;cursor:pointer;}
.btn.secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.kpi{background:var(--bg);border-radius:10px;padding:10px;text-align:center;}
.kpi .v{font-size:18px;font-weight:700;}
.kpi .l{font-size:11px;color:var(--muted);margin-top:2px;}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;}
.pill.good{background:var(--goodbg);color:var(--good);}
.pill.warn{background:var(--warnbg);color:var(--warn);}
.pill.bad{background:var(--badbg);color:var(--bad);}
.bar-row{display:flex;align-items:center;gap:8px;margin:8px 0;}
.bar-name{width:88px;font-size:12px;flex:none;}
.bar-track{flex:1;background:var(--bg);border-radius:6px;height:14px;overflow:hidden;}
.bar-fill{height:100%;border-radius:6px;background:var(--brand2);}
.bar-pct{width:44px;text-align:right;font-size:12px;flex:none;}
.msg{font-size:13px;padding:10px;border-radius:8px;margin-top:10px;display:none;}
.msg.show{display:block;}
.msg.ok{background:var(--goodbg);color:var(--good);}
.msg.err{background:var(--badbg);color:var(--bad);}
.foot{text-align:center;font-size:11px;color:var(--muted);padding:16px;}
.target-input{width:78px;padding:4px;text-align:center;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:16px;}
.modal-bg.show{display:flex;}
.modal{background:var(--card);border-radius:12px;padding:18px;max-width:320px;width:100%;}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;}
.tab-btn{flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;}
.tab-btn.active{background:var(--brand2);border-color:var(--brand2);color:#fff;}
</style>
